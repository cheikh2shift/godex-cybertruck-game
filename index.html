<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertruck Infinite Run</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000010;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff, 0 0 45px #0088ff;
            letter-spacing: 3px;
        }
        
        #powerup-display {
            position: absolute;
            top: 70px;
            left: 20px;
            display: flex;
            gap: 15px;
        }
        
        .powerup-icon {
            width: 60px;
            height: 60px;
            border: 3px solid #ffffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px #ff00ff, inset 0 0 20px rgba(255, 0, 255, 0.3);
            transition: all 0.3s;
            position: relative;
        }
        
        .powerup-icon.active {
            background: rgba(255, 255, 255, 0.9);
            animation: pulse 0.3s infinite;
            box-shadow: 0 0 40px #00ff00, 0 0 60px #00ff00;
        }
        
        .powerup-icon .count {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: #ff00ff;
            color: white;
            font-size: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            pointer-events: auto;
        }
        
        #game-over h1 {
            color: #ff0040;
            font-size: 72px;
            text-shadow: 0 0 30px #ff0040, 0 0 60px #ff0040;
            margin-bottom: 20px;
            animation: flicker 0.1s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        #game-over p {
            color: #00ffff;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00ffff;
        }
        
        #restart-btn {
            padding: 18px 50px;
            font-size: 22px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 200%;
            border: none;
            border-radius: 35px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s;
            pointer-events: auto;
            animation: gradientShift 2s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        #restart-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 50px #00ffff;
        }
        
        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: auto;
        }
        
        #start-screen h1 {
            color: #ffffff;
            font-size: 56px;
            text-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff, 0 0 120px #0088ff;
            margin-bottom: 15px;
            letter-spacing: 8px;
        }
        
        #start-screen h2 {
            color: #ff00ff;
            font-size: 32px;
            text-shadow: 0 0 25px #ff00ff;
            margin-bottom: 40px;
        }
        
        #start-screen p {
            color: #cccccc;
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 2;
        }
        
        #start-btn {
            padding: 25px 80px;
            font-size: 28px;
            background: linear-gradient(45deg, #00ffff, #00ff88, #00ffff);
            background-size: 200% 200%;
            border: none;
            border-radius: 40px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            transition: all 0.3s;
            pointer-events: auto;
            animation: glow 1.5s ease-in-out infinite, gradientShift 2s ease infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff; }
            50% { box-shadow: 0 0 60px #00ffff, 0 0 100px #00ff88, 0 0 150px #0088ff; }
        }
        
        #start-btn:hover {
            transform: scale(1.15);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 28px;
            text-shadow: 0 0 20px #00ffff;
            animation: pulse 1s infinite;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 16px;
            text-shadow: 0 0 10px #666;
        }
        
        #model-status {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px #00ff88;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading Models...</div>
        
        <div id="ui-overlay">
            <div id="score-display">
                SCORE: <span id="score">0</span> | SPEED: <span id="speed">0</span> km/h
            </div>
            
            <div id="powerup-display">
                <div class="powerup-icon" id="shield-icon" title="Shield (S)">🛡️<span class="count">3</span></div>
                <div class="powerup-icon" id="boost-icon" title="Boost (B)">⚡<span class="count">3</span></div>
                <div class="powerup-icon" id="slowmo-icon" title="Slow Motion (W)">⏱️<span class="count">3</span></div>
                <div class="powerup-icon" id="magnet-icon" title="Magnet (M)">🧲<span class="count">3</span></div>
            </div>
            
            <div id="start-screen">
                <h1>CYBERTRUCK</h1>
                <h2>INFINITE RUN</h2>
                <p>
                    ⬅️ ➡️ or A/D to move<br>
                    S - Shield | B - Boost | W - Slow Motion | M - Magnet
                </p>
                <button id="start-btn">START GAME</button>
            </div>
            
            <div id="game-over">
                <h1>GAME OVER</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
            
            <div id="model-status"></div>
            <div class="controls-hint">Use arrow keys or A/D to move</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // Game State
        const game = {
            isRunning: false,
            score: 0,
            speed: 50,
            baseSpeed: 50,
            maxSpeed: 200,
            lane: 1,
            lanes: [-4, 0, 4],
            playerX: 0,
            targetX: 0,
            
            powerups: {
                shield: { active: false, duration: 0, count: 3 },
                boost: { active: false, duration: 0, count: 3 },
                slowmo: { active: false, duration: 0, count: 3 },
                magnet: { active: false, duration: 0, count: 3 }
            },
            
            player: null,
            playerModel: null,
            enemyModel: null,
            enemies: [],
            powerupItems: [],
            particles: [],
            
            enemySpawnTimer: 0,
            powerupSpawnTimer: 0,
            modelsLoaded: 0,
            totalModels: 2
        };

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000018);
        scene.fog = new THREE.FogExp2(0x000030, 0.012);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 18);
        camera.lookAt(0, 0, -20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.8;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Bright Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(10, 30, 20);
        scene.add(mainLight);
        
        const cyanLight = new THREE.PointLight(0x00ffff, 4, 80);
        cyanLight.position.set(-15, 15, 0);
        scene.add(cyanLight);
        
        const magentaLight = new THREE.PointLight(0xff00ff, 4, 80);
        magentaLight.position.set(15, 15, 0);
        scene.add(magentaLight);
        
        const greenLight = new THREE.PointLight(0x00ff88, 3, 60);
        greenLight.position.set(0, 10, -20);
        scene.add(greenLight);

        // Create road
        function createRoad() {
            const roadGroup = new THREE.Group();
            
            const roadGeometry = new THREE.PlaneGeometry(16, 200);
            const roadMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2e,
                roughness: 0.6,
                metalness: 0.4,
                emissive: 0x0a0a15,
                emissiveIntensity: 0.3
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -50;
            roadGroup.add(road);
            
            const gridMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff });
            
            for (let i = -80; i < 80; i += 4) {
                const points = [new THREE.Vector3(-8, 0.02, i), new THREE.Vector3(8, 0.02, i)];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, gridMaterial);
                roadGroup.add(line);
            }
            
            for (let i = -8; i <= 8; i += 2) {
                const points = [new THREE.Vector3(i, 0.02, -100), new THREE.Vector3(i, 0.02, 20)];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geometry, gridMaterial);
                roadGroup.add(line);
            }
            
            const laneMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff00ff,
                transparent: true,
                opacity: 0.9
            });
            
            for (let i = -1; i <= 1; i += 2) {
                const laneGeometry = new THREE.PlaneGeometry(0.15, 200);
                const lane = new THREE.Mesh(laneGeometry, laneMaterial);
                lane.rotation.x = -Math.PI / 2;
                lane.position.set(i * 2, 0.03, -50);
                roadGroup.add(lane);
            }
            
            const edgeMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff,
                emissive: 0x00ffff,
                emissiveIntensity: 1
            });
            
            const leftEdge = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 200), edgeMaterial);
            leftEdge.position.set(-7.5, 0.15, -50);
            roadGroup.add(leftEdge);
            
            const rightEdge = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 200), edgeMaterial);
            rightEdge.position.set(7.5, 0.15, -50);
            roadGroup.add(rightEdge);
            
            return roadGroup;
        }

        // Load OBJ model
        function loadOBJModel(path, isPlayer = false) {
            return new Promise((resolve) => {
                const loader = new OBJLoader();
                loader.load(
                    path,
                    (object) => {
                        object.traverse((child) => {
                            if (child.isMesh) {
                                const color = isPlayer ? 0xcccccc : 0x333344;
                                child.material = new THREE.MeshStandardMaterial({
                                    color: color,
                                    metalness: 0.9,
                                    roughness: 0.1,
                                    emissive: isPlayer ? 0x222222 : 0x111122,
                                    emissiveIntensity: 0.4
                                });
                            }
                        });
                        
                        const box = new THREE.Box3().setFromObject(object);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const targetScale = (isPlayer ? 5 : 4) / maxDim;
                        
                        object.scale.setScalar(targetScale);
                        object.position.sub(center.multiplyScalar(targetScale));
                        
                        if (isPlayer) {
                            object.position.y = 0;
                        }
                        
                        resolve(object);
                    },
                    undefined,
                    (error) => {
                        console.warn(`Failed to load ${path}:`, error);
                        resolve(null);
                    }
                );
            });
        }

        // Create fallback player
        function createFallbackPlayer() {
            const group = new THREE.Group();
            
            const bodyShape = new THREE.Shape();
            bodyShape.moveTo(-1.4, 0);
            bodyShape.lineTo(-1.4, 1.3);
            bodyShape.lineTo(-1.1, 1.9);
            bodyShape.lineTo(1.1, 1.9);
            bodyShape.lineTo(1.4, 1.3);
            bodyShape.lineTo(1.4, 0);
            bodyShape.lineTo(-1.4, 0);
            
            const bodyGeometry = new THREE.ExtrudeGeometry(bodyShape, { steps: 1, depth: 5, bevelEnabled: false });
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0xeeeeee,
                metalness: 0.95,
                roughness: 0.05
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.rotation.y = Math.PI / 2;
            body.position.set(2.5, 0.6, 2.5);
            group.add(body);
            
            const wheelGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 24);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
            
            [[-1.5, 0.6, 1.6], [1.5, 0.6, 1.6], [-1.5, 0.6, -1.6], [1.5, 0.6, -1.6]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                group.add(wheel);
                
                const ringGeometry = new THREE.TorusGeometry(0.55, 0.06, 8, 32);
                const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2 });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.position.set(pos[0] > 0 ? pos[0] + 0.2 : pos[0] - 0.2, pos[1], pos[2]);
                ring.rotation.y = Math.PI / 2;
                group.add(ring);
            });
            
            const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 3 });
            const leftHeadlight = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.1), headlightMaterial);
            leftHeadlight.position.set(-0.6, 1.1, -2.55);
            group.add(leftHeadlight);
            
            const rightHeadlight = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.1), headlightMaterial);
            rightHeadlight.position.set(0.6, 1.1, -2.55);
            group.add(rightHeadlight);
            
            const tailMaterial = new THREE.MeshBasicMaterial({ color: 0xff0030, emissive: 0xff0030, emissiveIntensity: 2.5 });
            const leftTail = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.1), tailMaterial);
            leftTail.position.set(-0.6, 1.1, 2.55);
            group.add(leftTail);
            
            const rightTail = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.1), tailMaterial);
            rightTail.position.set(0.6, 1.1, 2.55);
            group.add(rightTail);
            
            const lightBarMaterial = new THREE.MeshBasicMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 2 });
            const lightBar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 4.5), lightBarMaterial);
            lightBar.position.set(0, 3.1, 0);
            group.add(lightBar);
            
            group.position.set(0, 0, 5);
            group.scale.set(0.85, 0.85, 0.85);
            
            return group;
        }

        // Create fallback enemy
        function createFallbackEnemy() {
            const group = new THREE.Group();
            
            const bodyGeometry = new THREE.BoxGeometry(2.8, 1.6, 5);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a3a,
                metalness: 0.9,
                roughness: 0.2,
                emissive: 0x111122,
                emissiveIntensity: 0.4
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.3;
            group.add(body);
            
            const cabGeometry = new THREE.BoxGeometry(2.4, 1.4, 1.8);
            const cabMaterial = new THREE.MeshStandardMaterial({
                color: 0x1a1a2a,
                metalness: 0.8,
                emissive: 0x003366,
                emissiveIntensity: 0.6
            });
            const cab = new THREE.Mesh(cabGeometry, cabMaterial);
            cab.position.set(0, 2.4, -1.2);
            group.add(cab);
            
            const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.35, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.7 });
            
            [[-1.4, 0.5, 1.5], [1.4, 0.5, 1.5], [-1.4, 0.5, -1.5], [1.4, 0.5, -1.5]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                group.add(wheel);
            });
            
            const beaconGeometry = new THREE.SphereGeometry(0.2, 8, 8);
            const beaconMaterial = new THREE.MeshBasicMaterial({ color: 0xff6600, emissive: 0xff6600, emissiveIntensity: 3 });
            const beacon = new THREE.Mesh(beaconGeometry, beaconMaterial);
            beacon.position.set(0, 3.2, -1.2);
            group.add(beacon);
            
            return group;
        }

        // Create power-up
        function createPowerupItem(type) {
            const group = new THREE.Group();
            
            let color, shape;
            switch(type) {
                case 'shield':
                    color = 0x00ff88;
                    shape = new THREE.OctahedronGeometry(1);
                    break;
                case 'boost':
                    color = 0xffff00;
                    shape = new THREE.ConeGeometry(0.8, 2, 8);
                    break;
                case 'slowmo':
                    color = 0xaa44ff;
                    shape = new THREE.TorusGeometry(0.8, 0.25, 8, 24);
                    break;
                case 'magnet':
                    color = 0xff44aa;
                    shape = new THREE.TorusKnotGeometry(0.6, 0.2, 64, 8);
                    break;
            }
            
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 1,
                metalness: 0.9,
                roughness: 0.1
            });
            
            const mesh = new THREE.Mesh(shape, material);
            group.add(mesh);
            
            const glowGeometry = new THREE.SphereGeometry(1.5, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.3
            });
            group.add(new THREE.Mesh(glowGeometry, glowMaterial));
            
            const light = new THREE.PointLight(color, 3, 12);
            group.add(light);
            
            group.userData = { type: type, rotationSpeed: 0.03 };
            
            return group;
        }

        // Create particle
        function createParticle(position, color) {
            const geometry = new THREE.SphereGeometry(0.15, 6, 6);
            const material = new THREE.MeshBasicMaterial({ 
                color: color,
                emissive: color,
                emissiveIntensity: 1.5
            });
            const particle = new THREE.Mesh(geometry, material);
            particle.position.copy(position);
            particle.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.8,
                    Math.random() * 0.8,
                    (Math.random() - 0.5) * 0.8
                ),
                life: 1
            };
            scene.add(particle);
            game.particles.push(particle);
        }

        // Spawn enemy using loaded model
        function spawnEnemy() {
            const enemy = game.enemyModel ? game.enemyModel.clone() : createFallbackEnemy();
            const lane = Math.floor(Math.random() * 3);
            enemy.position.set(game.lanes[lane], 0, -80);
            enemy.userData = { lane: lane };
            scene.add(enemy);
            game.enemies.push(enemy);
        }

        // Spawn power-up
        function spawnPowerup() {
            const types = ['shield', 'boost', 'slowmo', 'magnet'];
            const type = types[Math.floor(Math.random() * types.length)];
            const powerup = createPowerupItem(type);
            const lane = Math.floor(Math.random() * 3);
            powerup.position.set(game.lanes[lane], 2, -80);
            scene.add(powerup);
            game.powerupItems.push(powerup);
        }

        // Apply power-up
        function activatePowerup(type) {
            if (game.powerups[type].count <= 0) return;
            
            game.powerups[type].count--;
            updatePowerupUI();
            
            game.powerups[type].active = true;
            game.powerups[type].duration = 10;
            
            document.getElementById(`${type}-icon`).classList.add('active');
            
            switch(type) {
                case 'shield':
                    if (game.playerModel) {
                        game.playerModel.traverse(child => {
                            if (child.material && child.material.emissive) {
                                child.material.emissive = new THREE.Color(0x00ff88);
                                child.material.emissiveIntensity = 1;
                            }
                        });
                    }
                    break;
                case 'boost':
                    game.speed = game.maxSpeed;
                    break;
                case 'slowmo':
                    game.speed = game.baseSpeed * 0.25;
                    break;
            }
        }

        // Update power-up UI
        function updatePowerupUI() {
            Object.keys(game.powerups).forEach(key => {
                const icon = document.getElementById(`${key}-icon`);
                const countSpan = icon.querySelector('.count');
                countSpan.textContent = game.powerups[key].count;
            });
        }

        // Deactivate power-up
        function deactivatePowerup(type) {
            game.powerups[type].active = false;
            document.getElementById(`${type}-icon`).classList.remove('active');
            
            switch(type) {
                case 'shield':
                    if (game.playerModel) {
                        game.playerModel.traverse(child => {
                            if (child.material && child.material.emissive) {
                                child.material.emissive = new THREE.Color(0x000000);
                                child.material.emissiveIntensity = 0;
                            }
                        });
                    }
                    break;
                case 'boost':
                case 'slowmo':
                    game.speed = game.baseSpeed;
                    break;
            }
        }

        // Check collision
        function checkCollision(obj1, obj2, distance = 3) {
            const dx = obj1.position.x - obj2.position.x;
            const dz = obj1.position.z - obj2.position.z;
            return Math.sqrt(dx * dx + dz * dz) < distance;
        }

        // Game over
        function gameOver() {
            game.isRunning = false;
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').textContent = Math.floor(game.score);
            
            for (let i = 0; i < 50; i++) {
                createParticle(game.player.position.clone(), 0xff4400);
            }
        }

        // Reset game
        function resetGame() {
            game.enemies.forEach(e => scene.remove(e));
            game.enemies = [];
            
            game.powerupItems.forEach(p => scene.remove(p));
            game.powerupItems = [];
            
            game.particles.forEach(p => scene.remove(p));
            game.particles = [];
            
            game.score = 0;
            game.speed = game.baseSpeed;
            game.lane = 1;
            game.playerX = 0;
            game.targetX = 0;
            game.enemySpawnTimer = 0;
            game.powerupSpawnTimer = 0;
            
            Object.keys(game.powerups).forEach(key => {
                game.powerups[key].active = false;
                game.powerups[key].duration = 0;
                game.powerups[key].count = 3;
                document.getElementById(`${key}-icon`).classList.remove('active');
            });
            updatePowerupUI();
            
            if (game.player) {
                game.player.position.set(0, 0, 5);
            }
            
            document.getElementById('game-over').style.display = 'none';
            game.isRunning = true;
        }

        // Input handling
        document.addEventListener('keydown', (e) => {
            if (!game.isRunning) return;
            
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                game.lane = Math.max(0, game.lane - 1);
            }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                game.lane = Math.min(2, game.lane + 1);
            }
            
            if (e.key.toLowerCase() === 's') activatePowerup('shield');
            if (e.key.toLowerCase() === 'b') activatePowerup('boost');
            if (e.key.toLowerCase() === 'w') activatePowerup('slowmo');
            if (e.key.toLowerCase() === 'm') activatePowerup('magnet');
        });

        // Initialize
        async function init() {
            const statusEl = document.getElementById('model-status');
            
            // Create road
            const road = createRoad();
            scene.add(road);
            
            // Load player model (cybertruck)
            try {
                const playerModel = await loadOBJModel('64-truck/untitled_quardfaced.obj', true);
                if (playerModel) {
                    game.playerModel = playerModel;
                    statusEl.textContent = '✓ Cybertruck model loaded';
                } else {
                    statusEl.textContent = '⚠ Using fallback player';
                }
            } catch (e) {
                statusEl.textContent = '⚠ Using fallback player';
            }
            
            // Load enemy model (C4 explosive as different vehicle)
            try {
                const enemyModel = await loadOBJModel('72-24-c4/C4/C4.obj', false);
                if (enemyModel) {
                    game.enemyModel = enemyModel;
                    statusEl.textContent += ' | ✓ Enemy model loaded';
                } else {
                    statusEl.textContent += ' | ⚠ Using fallback enemy';
                }
            } catch (e) {
                statusEl.textContent += ' | ⚠ Using fallback enemy';
            }
            
            // Create player
            game.player = game.playerModel ? game.playerModel.clone() : createFallbackPlayer();
            game.player.position.set(0, 0, 5);
            scene.add(game.player);
            
            // Event listeners
            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-screen').style.display = 'none';
                game.isRunning = true;
            });
            
            document.getElementById('restart-btn').addEventListener('click', resetGame);
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
            
            // Start animation
            animate();
        }

        // Animation loop
        let lastTime = 0;
        function animate(currentTime = 0) {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!game.isRunning) {
                renderer.render(scene, camera);
                return;
            }
            
            // Update score
            game.score += game.speed * deltaTime * 0.1;
            document.getElementById('score').textContent = Math.floor(game.score);
            document.getElementById('speed').textContent = Math.floor(game.speed * 3);
            
            // Update power-ups
            Object.keys(game.powerups).forEach(key => {
                if (game.powerups[key].active) {
                    game.powerups[key].duration -= deltaTime;
                    if (game.powerups[key].duration <= 0) {
                        deactivatePowerup(key);
                    }
                }
            });
            
            // Player movement
            game.targetX = game.lanes[game.lane];
            game.playerX += (game.targetX - game.playerX) * 0.12;
            game.player.position.x = game.playerX;
            
            const tilt = (game.targetX - game.playerX) * 0.15;
            game.player.rotation.z = -tilt;
            
            // Spawn enemies
            game.enemySpawnTimer += deltaTime;
            const spawnInterval = Math.max(0.8, 2.5 - game.speed / 150);
            if (game.enemySpawnTimer > spawnInterval) {
                spawnEnemy();
                game.enemySpawnTimer = 0;
            }
            
            // Spawn power-ups
            game.powerupSpawnTimer += deltaTime;
            if (game.powerupSpawnTimer > 7) {
                spawnPowerup();
                game.powerupSpawnTimer = 0;
            }
            
            // Update enemies
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                enemy.position.z += game.speed * deltaTime * 0.5;
                
                if (checkCollision(game.player, enemy, 2.8)) {
                    if (game.powerups.shield.active) {
                        for (let j = 0; j < 15; j++) {
                            createParticle(enemy.position.clone(), 0x00ff88);
                        }
                        scene.remove(enemy);
                        game.enemies.splice(i, 1);
                        game.score += 100;
                    } else {
                        gameOver();
                        return;
                    }
                }
                
                if (enemy.position.z > 25) {
                    scene.remove(enemy);
                    game.enemies.splice(i, 1);
                    game.score += 15;
                }
            }
            
            // Update power-up items
            for (let i = game.powerupItems.length - 1; i >= 0; i--) {
                const powerup = game.powerupItems[i];
                powerup.position.z += game.speed * deltaTime * 0.5;
                powerup.rotation.y += powerup.userData.rotationSpeed;
                powerup.rotation.x += powerup.userData.rotationSpeed * 0.5;
                
                if (game.powerups.magnet.active) {
                    const dx = game.player.position.x - powerup.position.x;
                    powerup.position.x += dx * 0.15;
                }
                
                if (checkCollision(game.player, powerup, 2.2)) {
                    activatePowerup(powerup.userData.type);
                    for (let j = 0; j < 15; j++) {
                        createParticle(powerup.position.clone(), 0xff00ff);
                    }
                    scene.remove(powerup);
                    game.powerupItems.splice(i, 1);
                }
                
                if (powerup.position.z > 25) {
                    scene.remove(powerup);
                    game.powerupItems.splice(i, 1);
                }
            }
            
            // Update particles
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const particle = game.particles[i];
                particle.position.add(particle.userData.velocity);
                particle.userData.velocity.y -= 0.025;
                particle.userData.life -= 0.025;
                
                if (particle.material) {
                    particle.material.opacity = particle.userData.life;
                }
                
                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    game.particles.splice(i, 1);
                }
            }
            
            // Road grid animation
            scene.children.forEach(child => {
                if (child instanceof THREE.Line) {
                    child.position.z += game.speed * deltaTime * 0.15;
                    if (child.position.z > 5) child.position.z = -95;
                }
            });
            
            // Camera
            camera.position.x = game.playerX * 0.25;
            
            // Speed
            game.baseSpeed = Math.min(game.maxSpeed, 50 + game.score * 0.008);
            if (!game.powerups.boost.active && !game.powerups.slowmo.active) {
                game.speed = game.baseSpeed;
            }
            
            renderer.render(scene, camera);
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
