<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybertruck Infinite Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading Models...</div>
        
        <div id="ui-overlay">
            <div id="score-display">
                SCORE: <span id="score">0</span> | SPEED: <span id="speed">0</span> km/h
            </div>
            
            <div id="powerup-display">
                <div class="powerup-icon" id="shield-icon" title="Shield (S)">🛡️<span class="count">3</span></div>
                <div class="powerup-icon" id="boost-icon" title="Boost (B)">⚡<span class="count">3</span></div>
                <div class="powerup-icon" id="slowmo-icon" title="Slow Motion (W)">⏱️<span class="count">3</span></div>
                <div class="powerup-icon" id="magnet-icon" title="Magnet (M)">🧲<span class="count">3</span></div>
            </div>
            
            <div id="start-screen">
                <h1>CYBERTRUCK</h1>
                <h2>INFINITE RUN</h2>
                <p>
                    ⬅️ ➡️ or A/D to move<br>
                    S - Shield | B - Boost | W - Slow Motion | M - Magnet
                </p>
                <button id="start-btn">START GAME</button>
            </div>
            
            <div id="game-over">
                <h1>GAME OVER</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">PLAY AGAIN</button>
            </div>
            
            <div id="model-status"></div>
            <div class="controls-hint">Use Arrow Keys or A/D to Move</div>
        </div>
    </div>
    
    <!-- Three.js and Loaders (must load first) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Game Modules (order matters!) -->
    <script src="js/constants.js"></script>
    
    <!-- Loaders depend on THREE being loaded -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/road.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
